[project]
name = "smoke-fizzbuzz"
version = "0.0.0"
requires-python = ">=3.11"

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.10", "pytest>=8"]

# La vara de la fixture es la MISMA que la del repo que la valida (ver el encabezado de
# `pyproject.toml` en la raiz): el ruleset que prescribe `backend-best-practices`, menos `S`
# por el mismo motivo. Si se relaja aqui, el smoke deja de probar al runner contra una vara
# realista y empieza a darle un aprobado que no vale.
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "B",
    "C4",
    "C90",
    "UP",
    "RUF",
    "PERF",
    "TC",
    "PL",
    "PGH",
    "FURB",
    "PT",
]
fixable = ["ALL"]
future-annotations = true
extend-safe-fixes = ["TC001", "TC002", "TC003", "TC004", "UP037"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0913", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
