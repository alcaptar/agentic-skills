[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-skills"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.scripts]
slice-runner = "slice_runner.infrastructure.cli:Cli.main"

[tool.hatch.build.targets.wheel]
packages = ["src/slice_runner"]

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.10", "pytest>=8"]

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "B",
    "C4",
    "C90",
    "UP",
    "RUF",
    "PERF",
    "TC",
    "PL",
    "PGH",
    "FURB",
    "PT",
    "TID",
]
fixable = ["ALL"]
future-annotations = true
extend-safe-fixes = ["TC001", "TC002", "TC003", "TC004", "UP037"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0913", "PLR2004"]
"src/slice_runner/tests/*" = ["PLR0913", "PLR2004"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "slice_runner.infrastructure.contract_model.ContractModel",
    "slice_runner.infrastructure.durable_ledger.LedgerRow",
    "slice_runner.infrastructure.open_vocabulary_model.OpenVocabularyModel",
]

[tool.ruff.lint.isort]
known-first-party = [
    "deploy_core",
    "discover_controles",
    "discover_conventions",
    "metrics",
    "slice_runner",
]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.mypy]
strict = true
mypy_path = "src:skills/slice-runner/scripts"

[tool.pytest.ini_options]
testpaths = ["tests", "src/slice_runner/tests"]
markers = [
    "integration: lanza un subproceso real (se deselecciona con -m 'not integration')",
]
pythonpath = ["src", "skills/slice-runner/scripts", "skills/deploy-watch/scripts"]
